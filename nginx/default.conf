# log_format define el formato de cada línea del access log. La
# palabra clave "escape=json" (disponible desde nginx 1.11.8) le
# dice a nginx que escape automáticamente caracteres especiales
# dentro de los valores (comillas, barras invertidas, etc.), para
# que el resultado sea JSON válido sin que tengamos que hacerlo
# manualmente.
log_format json_analytics escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_user_agent":"$http_user_agent"'
  '}';

server {
    # Puerto en el que nginx escucha DENTRO del contenedor. Lo
    # mapeamos al host en docker-compose.yml (8080 -> 80).
    listen 80;

    # access_log usa el formato json_analytics que definimos arriba.
    # La ruta /var/log/nginx/access.log es la que la imagen oficial
    # de nginx deja simbólicamente enlazada a /dev/stdout, así que
    # todo lo que escribamos aquí también sale por stdout del
    # contenedor — y de ahí lo recoge el logging driver de Docker,
    # exactamente igual que con tu API.
    access_log /var/log/nginx/access.log json_analytics;

    location / {
        # proxy_pass reenvía la petición al contenedor de tu API,
        # usando el nombre del servicio de docker-compose ("api")
        # como si fuera un hostname. A diferencia del problema que
        # tuvimos con el logging driver de Fluentd, ESTA conexión sí
        # la hace el propio proceso de nginx corriendo DENTRO del
        # contenedor (no el daemon de Docker), así que el DNS interno
        # de la red de compose sí funciona aquí sin problema.
        proxy_pass http://api:8000;

        # Estas cabeceras preservan información original del cliente
        # que de otro modo se perdería al pasar por el proxy (nginx,
        # por defecto, haría la petición a la API como si viniera de
        # sí mismo, no del cliente real).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}