# fluent.conf
#
# Este archivo le dice a Fluentd dos cosas:
#   1) <source>  -> de dónde va a RECIBIR los logs (input)
#   2) <match>   -> a dónde los va a MANDAR una vez recibidos (output)

<source>
  # @type forward es el protocolo nativo de Fluentd para recibir logs
  # por red. Es justo el protocolo que usa el "logging driver" de
  # Docker cuando le decimos --log-driver=fluentd en docker-compose.yml,
  # así que no necesitamos instalar nada adicional del lado de Docker.
  @type forward

  # Puerto estándar en el que Fluentd escucha conexiones forward.
  port 24224

  # 0.0.0.0 significa "acepta conexiones desde cualquier IP", lo cual
  # es necesario aquí porque el contenedor de la API está en otra
  # red/contenedor distinto al de Fluentd, no en localhost.
  bind 0.0.0.0
</source>

# docker.** es un patrón de "tag" (etiqueta). Ya confirmamos que
# Docker manda tus logs con la etiqueta exacta "docker.fastapi",
# así que este patrón los captura correctamente. El doble asterisco
# ** dice "docker.CUALQUIER-COSA", incluyendo tags con varios niveles.
<match docker.**>
  # @type copy permite mandar el mismo log a varios destinos (<store>)
  # a la vez, sin tener que elegir uno solo.
  @type copy

  <store>
    # Imprime los logs también en la consola de Fluentd, útil para
    # ver en tiempo real (con `docker compose logs -f fluentd`) que
    # los logs están llegando correctamente mientras pruebas.
    @type stdout
  </store>

  <store>
    # Fluentd siempre incrusta la fecha en el nombre del archivo real
    # (comportamiento interno del plugin "file", no configurable de
    # forma limpia). En vez de pelear contra eso, lo aceptamos: cada
    # día genera un archivo como "docker.20260902.log", con "append
    # true" acumulando todo lo del día dentro de ese mismo archivo.
    #
    # Cuando quieras tu entregable final "docker.json", lo generas
    # con un solo comando que junta todos los archivos del día (o de
    # todos los días) en uno solo:
    #
    #   cat fluentd/log/docker.*.log > fluentd/log/docker.json
    #
    # Esto es simple, siempre funciona, y no depende de ningún
    # comportamiento interno frágil del plugin.
    @type file
    path /fluentd/log/docker
    append true

    <buffer>
      @type file
      path /fluentd/log/buffer
      flush_mode interval
      flush_interval 5s
    </buffer>
  </store>
</match>